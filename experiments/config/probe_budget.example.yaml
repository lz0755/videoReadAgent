# M0.0 explicit authorization & probe budget template.
# Copy to a local untracked file (or pass --budget-config) and opt in explicitly before any --live run.
# NEVER store API keys in this file; provide credentials only via the configured environment variable.

authorization:
  # Must be true AND paired with --live CLI flag to send any live cloud request.
  cloud_egress_authorized: false
  live_enabled: false
  authorized_by: ""
  authorization_note: "Offline default template; cloud egress disabled."
  # Files API upload/reuse/expiry/delete requires separate explicit authorization and a short TTL.
  # Files API is NOT used in P0 production paths.
  files_api_upload_authorized: false
  files_api_ttl_seconds: 3600

budget:
  # All four limits are mandatory for live startup; omitting any field rejects live execution.
  max_model_attempts: 12
  max_provider_http_attempts: 8
  max_transferred_bytes: 15728640  # 15 MiB total probe transfer cap
  deadline_seconds: 180
  per_request_timeout_seconds: 45
  max_retries_per_request: 2  # SDK retries are strictly 0; app retries count against caps above.
